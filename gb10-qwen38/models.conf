# ---------------------------------------------------------------------------
# Fuente unica de verdad para la migracion a Qwen3.8-27B en la GB10.
# Todos los scripts de este directorio leen de aqui. Editar SOLO este archivo.
# ---------------------------------------------------------------------------

# Alias estable al que apuntan las aplicaciones. La idea central de esta
# migracion: las apps nunca nombran un modelo concreto, siempre nombran el
# alias. Cambiar de modelo = repuntar el alias, no editar N configs.
ALIAS="work-default"

# Modelo nuevo. NVFP4 es formato nativo de Blackwell (sm_121), que es lo que
# lleva el GB10. Corre ~1.5x mas rapido que BF16 en este hardware.
NEW_MODEL="qwen3.8:27b-nvfp4"

# Alternativa GGUF por si el runtime no soporta NVFP4 (llama.cpp viejo, etc).
# Q4_K_M ~17.1GB. Con 128GB unificados sobra espacio de contexto.
NEW_MODEL_GGUF="qwen3.8:27b"

# Proyector multimodal. OJO: el 27B tiene vision, pero en GGUF las imagenes
# fallan EN SILENCIO si no se carga el mmproj (~0.9GB). Dejar vacio si solo
# se usa texto.
NEW_MODEL_MMPROJ=""

# Modelo viejo. Lo rellena 00-inventory.sh con lo que encuentre corriendo.
# NO se borra nunca: es el fallback y la mitad B del A/B.
OLD_MODEL=""

# Endpoint del runtime local.
OLLAMA_HOST="${OLLAMA_HOST:-http://localhost:11434}"
